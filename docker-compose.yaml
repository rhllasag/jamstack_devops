# Use root/example as user/password credentials
version: '3.1'

services:

  quasar:
    build:
      context: './../'
      dockerfile: devops/quasar/Dockerfile
    container_name: node_quasar_${ENV}
    volumes:
      - ../quasar_vue/:/var/www/quasar/:rw
    ports:
    - ${VUEPORT}:${VUEPORT}
    networks:
    - menu_net
  flask:
    build:
      context: './../'
      dockerfile: devops/flask/Dockerfile
    container_name: python_flask_${ENV}
    volumes:
      - ../flask_api/:/flask/:rw
    environment:
      MONGODB: ${MONGODB}
      MONGOHOST: ${MONGOHOST}
      MONGOPORT: ${MONGOPORT}
      MONGOUSER: ${MONGOUSER}
      MONGOPASS: ${MONGOPASS}
    ports:
    - ${FLASKPORT}:${FLASKPORT}
    networks:
    - menu_net
  mongo:
    image: mongo
    restart: always
    container_name: mongo_${ENV}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGOUSER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGOPASS}
    networks:
    - menu_net

  mongo-express:
    image: mongo-express
    restart: always
    ports:
    - ${MONGOEXPRESSPORT}:${MONGOEXPRESSPORT}
    container_name: mongo_express_${ENV}
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGOUSER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGOPASS}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGOUSER}:${MONGOPASS}@${MONGOHOST}:${MONGOPORT}/
      ME_CONFIG_BASICAUTH: false
    networks:
    - menu_net

networks:
  menu_net:
    name: menu_net